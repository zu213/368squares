<!DOCTYPE html>
<head>
    <script type="module" src="./368.js" ></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <link rel="stylesheet" type="text/css" href="./368.css?v=1">
</head>

<body>

    <h1>
        Matching game
    </h1>
    <div class="intro">
        Drag and drop pairs of cubes into the grid match 3 or more in a row to remove them, 
        try and get rid of as many as possible without filling up the board.
    </div>

    <div id="background" class="container">
        
        <div class="counter-container">
            <div id="remainingChickens" class="inline-left remaining-chickens"></div>
            <div class="inline-right absolute">
                <button id="resetButton">Reset</button>
            </div>
        </div>

        <div id="grid" class="grid"></div>
        <div id="chickenGenerator" class="chicken-gen"></div>
    </div>

    <div class="leaderboard">
        <h2>Leaderboard</h2>
        <div id="leaderboard-list">

        </div>
    </div>
</body>

<template id="leaderboardEntryTemplate">
    <div class="leaderboard-form-container">
        <div class="leaderboard-form">
            <form id="scoreForm">
                <button type="button" class="leaderboard-close">x</button>
                <span class="leaderboard-name">
                    <input type="text" class="leaderboard-name-input" placeholder="Enter your name">
                </span>
                <span class="leaderboard-score">
                    <input type="number" class="leaderboard-score-input" readonly>
                </span>
                <button type="submit" class="leaderboard-submit">Submit</button>
            </form>
        </div>
    </div>
</template>
