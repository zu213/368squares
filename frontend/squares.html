<!DOCTYPE html>
<head>
    <script type="module" src="./368.js" ></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <link rel="stylesheet" type="text/css" href="./368.css?v=1">
</head>

<body>

    <div class="game">
        <button id="infoButton" class="info-button" aria-label="How to play">i</button>
        <h1>
            368 Squares
        </h1>

        <div id="background" class="container">
            
            <div class="counter-container">
                <div id="remainingChickens" class="inline-left remaining-chickens"></div>
                <div class="inline-right">
                    <button id="resetButton" class="reset-button">Reset</button>
                </div>
            </div>

            <div id="grid" class="grid"></div>
            <div id="chickenGenerator" class="chicken-gen"></div>
        </div>

        <div class="leaderboard">
            <h2>Leaderboard</h2>
            <div id="leaderboard-list">

            </div>
        </div>
    </div>
    <footer>    
    </footer>
</body>


<template id="infoPopupTemplate">
    <div class="leaderboard-form-container">
        <div class="leaderboard-form info-popup">
            <button type="button" class="leaderboard-close">x</button>
            <h2 class="leaderboard-form-title">HOW TO PLAY</h2>
            <p>
                Drag and drop pairs of cubes into the grid match 3 or more in a row to remove them,
                try and get rid of as many as possible without filling up the board.
            </p>
        </div>
    </div>
</template>

<template id="leaderboardEntryTemplate">
    <div class="leaderboard-form-container">
        <div class="leaderboard-form">
            <h2 class="leaderboard-form-title">GAME OVER</h2>
            <form id="scoreForm">
                <button type="button" class="leaderboard-close">x</button>
                <span class="leaderboard-name">
                    <input type="text" class="leaderboard-name-input" placeholder="NAME" maxlength="4">
                </span>
                <div class="leaderboard-score-input"></div>
                <button type="submit" class="leaderboard-submit">Submit</button>
            </form>
        </div>
    </div>
</template>
